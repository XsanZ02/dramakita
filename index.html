<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* RESET & BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Roboto', sans-serif; 
        background-color: #0f0f0f; 
        color: white; 
        overflow-x: hidden;
    }

    /* HEADER */
    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 15px; background: #0f0f0f; position: sticky; top: 0; z-index: 10;
        border-bottom: 1px solid #222;
    }
    .logo { font-weight: bold; font-size: 18px; display: flex; align-items: center; letter-spacing: -0.5px; color: #fff;}
    .logo span { color: #cc0000; margin-right: 5px; font-size: 20px;}

    /* PLAYER CONTAINER */
    .video-wrapper {
        width: 100%; max-width: 600px; margin: 0 auto;
        position: relative; background: #000; cursor: pointer;
    }
    .thumbnail-box {
        position: relative; width: 100%; padding-top: 56.25%; /* 16:9 Aspect Ratio */
        overflow: hidden; background: #111;
    }
    .thumbnail {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; opacity: 0.8; transition: opacity 0.3s;
    }
    
    /* PLAY BUTTON STYLE */
    .play-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.3);
        display: flex; align-items: center; justify-content: center;
    }
    .play-btn {
        width: 70px; height: 70px;
        background: rgba(204, 0, 0, 0.9);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 20px rgba(204,0,0,0.4);
        animation: pulse 2s infinite;
    }
    .play-triangle {
        width: 0; height: 0;
        border-top: 12px solid transparent; border-bottom: 12px solid transparent;
        border-left: 22px solid white; margin-left: 5px;
    }

    /* INFO AREA */
    .video-info { padding: 15px; max-width: 600px; margin: 0 auto; }
    .video-title { font-size: 18px; font-weight: 500; line-height: 1.4; margin-bottom: 10px; color: #fff; }
    .video-meta { font-size: 13px; color: #aaa; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;}
    .badge-hd { background: #333; color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 10px; border: 1px solid #555; }

    /* ACTION BUTTONS */
    .actions { display: flex; justify-content: space-around; border-top: 1px solid #222; border-bottom: 1px solid #222; padding: 15px 0; margin-top: 10px;}
    .action-btn { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 12px; gap: 8px; cursor: pointer; }
    .action-btn:hover { color: white; }
    .icon { font-size: 20px; }

    /* LOADING SCREEN */
    .loading-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 20;
        display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .spinner {
        width: 40px; height: 40px; border: 4px solid #333; 
        border-radius: 50%; border-top-color: #cc0000; animation: spin 0.8s ease-in-out infinite; margin-bottom: 15px;
    }

    /* ADMIN PANEL STYLE */
    .admin-panel {
        max-width: 450px; margin: 40px auto; padding: 25px;
        background: #1a1a1a; border-radius: 12px; text-align: center; border: 1px solid #333;
        display: none;
    }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; color: #aaa; margin-bottom: 5px; font-size: 12px; }
    input { 
        width: 100%; padding: 12px; background: #2a2a2a; 
        border: 1px solid #444; color: white; border-radius: 6px; outline: none;
    }
    button.gen-btn { 
        width: 100%; padding: 14px; background: linear-gradient(45deg, #cc0000, #ff0000); color: white; 
        border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .result-box { margin-top: 20px; word-break: break-all; background: #000; padding: 15px; border-radius: 6px; display: none; color: #0f0; font-size: 13px; border: 1px dashed #444;}

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(204, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- === MODE PENGUNJUNG (PLAYER) === -->
<div id="visitor-view" style="display: none;">
    <div class="header">
        <div class="logo"><span>▶</span> Play Video</div>
        <div style="font-size: 14px; color: #aaa;">Login</div>
    </div>

    <div class="video-wrapper" onclick="handleClick()">
        <div class="thumbnail-box">
            <!-- Gambar Thumbnail akan muncul disini -->
            <img id="main-thumb" src="" class="thumbnail" alt="Video">
            <div class="play-overlay">
                <div class="play-btn">
                    <div class="play-triangle"></div>
                </div>
            </div>
        </div>
        
        <div id="loader" class="loading-screen">
            <div class="spinner"></div>
            <p style="color: #aaa; font-size: 14px;">Memuat Video...</p>
        </div>
    </div>

    <div class="video-info" onclick="handleClick()">
        <div class="video-title" id="video-title-text">Full Video: Watch Now (HD)</div>
        <div class="video-meta">
            <span class="badge-hd">HD 1080p</span>
            <span>• 3.4M Views</span>
            <span>• Viral Today</span>
        </div>
        
        <div class="actions">
            <div class="action-btn"><div class="icon">👍</div>Like</div>
            <div class="action-btn"><div class="icon">💬</div>Comment</div>
            <div class="action-btn"><div class="icon">🚀</div>Share</div>
            <div class="action-btn"><div class="icon">⬇️</div>Download</div>
        </div>
    </div>
</div>

<!-- === MODE ADMIN (UNIVERSAL GENERATOR) === -->
<div id="admin-view" class="admin-panel">
    <h3 style="color:white; margin-bottom: 20px;">🌐 Universal Link Generator</h3>
    
    <div class="input-group">
        <label>1. Link Tujuan (YouTube / LK21 / Web Apa Saja)</label>
        <input type="text" id="target-input" placeholder="https://..." />
    </div>

    <div class="input-group">
        <label>2. Link Gambar Poster / Thumbnail (Opsional)</label>
        <input type="text" id="thumb-input" placeholder="https://..." />
        <small style="color:#666; font-size: 10px;">*Biarkan kosong jika link YouTube, otomatis ambil thumbnail.</small>
    </div>

    <button class="gen-btn" onclick="generateUniversalLink()">GENERATE LINK</button>
    
    <div id="result" class="result-box"></div>
</div>

<script>
    // --- GANTI LINK ADSTERRA ANDA DISINI ---
    const myAdsterraLink = "https://www.effectivegatecpm.com/fnzc8b0iw?key=c99c0949991c9b065fa16ec0295db5b4";

    // --- LOGIKA UTAMA ---
    const urlParams = new URLSearchParams(window.location.search);
    
    // Kita cek parameter 'url' (untuk link umum) atau 'v' (untuk youtube lama)
    const targetUrl = urlParams.get('url'); 
    const customImg = urlParams.get('img');
    const youtubeId = urlParams.get('v');

    // Default Image jika tidak ada gambar (Gambar Player Gelap)
    const defaultThumb = "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80";

    if (targetUrl || youtubeId) {
        // --- MODE VISITOR ---
        document.getElementById('visitor-view').style.display = 'block';
        const thumbImg = document.getElementById('main-thumb');

        if (youtubeId) {
            // Jika format lama (?v=...)
            thumbImg.src = `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
            document.title = "Nonton Video YouTube";
        } else if (targetUrl) {
            // Jika format baru (?url=...)
            if (customImg) {
                thumbImg.src = decodeURIComponent(customImg);
            } else {
                // Coba deteksi jika user malas input gambar tapi linknya Youtube
                const ytMatch = targetUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
                if (ytMatch) {
                    thumbImg.src = `https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg`;
                } else {
                    thumbImg.src = defaultThumb;
                }
            }
            document.title = "Video Player";
        }

    } else {
        // --- MODE ADMIN ---
        document.getElementById('admin-view').style.display = 'block';
    }

    // --- FUNGSI KLIK PENGUNJUNG ---
    function handleClick() {
        let finalDest = "";
        
        // Tentukan tujuan akhir
        if (youtubeId) {
            finalDest = "https://www.youtube.com/watch?v=" + youtubeId;
        } else if (targetUrl) {
            finalDest = decodeURIComponent(targetUrl); // Decode agar link kembali normal
        } else {
            return;
        }

        // Tampilkan Loading
        document.getElementById('loader').style.display = 'flex';

        // 1. Buka Tujuan Asli di Tab Baru
        window.open(finalDest, '_blank');

        // 2. Redirect Tab Ini ke Iklan (3 Detik Delay)
        setTimeout(function() {
            window.location.href = myAdsterraLink;
        }, 3000);
    }

    // --- FUNGSI GENERATOR LINK (ADMIN) ---
    function generateUniversalLink() {
        const targetInp = document.getElementById('target-input').value.trim();
        const thumbInp = document.getElementById('thumb-input').value.trim();
        const resultBox = document.getElementById('result');

        if (!targetInp) {
            alert("Isi dulu Link Tujuannya!");
            return;
        }

        // Base URL (Domain Anda)
        // Hapus parameter lama jika ada
        const baseUrl = window.location.href.split('?')[0]; 
        
        // Encode URL agar karakter aneh tidak merusak link
        const encodedTarget = encodeURIComponent(targetInp);
        
        let finalLink = `${baseUrl}?url=${encodedTarget}`;

        // Jika ada gambar custom
        if (thumbInp) {
            const encodedImg = encodeURIComponent(thumbInp);
            finalLink += `&img=${encodedImg}`;
        }

        // Tampilkan Hasil
        resultBox.style.display = 'block';
        resultBox.innerHTML = `
            <div style="margin-bottom:5px; color:#fff;">Salin Link Ini:</div>
            <a href="${finalLink}" style="color:#0f0; word-break:break-all; text-decoration:none;">${finalLink}</a>
            <br><br>
            <button onclick="navigator.clipboard.writeText('${finalLink}')" style="background:#333; color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:4px;">Copy to Clipboard</button>
        `;
    }
</script>

</body>
</html>
