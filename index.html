<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Drama Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* RESET & BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Roboto', sans-serif; 
        background-color: #0f0f0f; 
        color: white; 
        overflow-x: hidden;
    }

    /* HEADER (Mirip App YouTube) */
    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 15px; background: #0f0f0f; position: sticky; top: 0; z-index: 10;
    }
    .logo { font-weight: bold; font-size: 18px; display: flex; align-items: center; letter-spacing: -1px;}
    .logo span { background: red; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
    .search-icon { width: 24px; height: 24px; border: 2px solid white; border-radius: 50%; position: relative; }
    .search-icon::after { content:''; position: absolute; bottom: -6px; right: -6px; width: 8px; height: 2px; background: white; transform: rotate(45deg); }

    /* PLAYER CONTAINER */
    .video-wrapper {
        width: 100%; max-width: 600px; margin: 0 auto;
        position: relative; background: black; cursor: pointer;
    }
    .thumbnail-box {
        position: relative; width: 100%; padding-top: 56.25%; /* 16:9 Aspect Ratio */
        overflow: hidden;
    }
    .thumbnail {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; opacity: 0.9;
    }
    
    /* PLAY BUTTON DENGAN EFEK */
    .play-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.2);
        display: flex; align-items: center; justify-content: center;
    }
    .play-btn {
        width: 65px; height: 65px;
        background: rgba(30, 30, 30, 0.8);
        backdrop-filter: blur(4px);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        border: 2px solid rgba(255,255,255,0.1);
        animation: pulse 2s infinite;
        transition: transform 0.2s;
    }
    .play-triangle {
        width: 0; height: 0;
        border-top: 10px solid transparent; border-bottom: 10px solid transparent;
        border-left: 18px solid white; margin-left: 4px;
    }

    /* VIDEO INFO (BAWAH PLAYER) */
    .video-info { padding: 15px; max-width: 600px; margin: 0 auto; }
    .video-title { font-size: 16px; font-weight: 500; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
    .video-meta { font-size: 12px; color: #aaa; margin-bottom: 15px; }
    
    /* ACTION BUTTONS (LIKE/SHARE) */
    .actions { display: flex; justify-content: space-around; border-bottom: 1px solid #333; padding-bottom: 15px; }
    .action-btn { display: flex; flex-direction: column; align-items: center; color: white; font-size: 11px; gap: 6px; cursor: pointer; }
    .icon-circle { width: 35px; height: 35px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }

    /* LOADING OVERLAY */
    .loading-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: black; z-index: 20;
        display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); 
        border-radius: 50%; border-top-color: red; animation: spin 0.8s ease-in-out infinite; margin-bottom: 15px;
    }

    /* ADMIN PANEL */
    .admin-panel {
        max-width: 400px; margin: 40px auto; padding: 25px;
        background: #1e1e1e; border-radius: 12px; text-align: center; border: 1px solid #333;
        display: none;
    }
    input { 
        width: 100%; padding: 12px; margin: 15px 0; background: #333; 
        border: 1px solid #444; color: white; border-radius: 6px; outline: none;
    }
    button.gen-btn { 
        width: 100%; padding: 12px; background: #cc0000; color: white; 
        border: none; border-radius: 6px; font-weight: bold; cursor: pointer; 
    }
    .result-box { margin-top: 20px; word-break: break-all; background: #000; padding: 10px; border-radius: 6px; display: none; color: #0f0; font-size: 12px;}

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- === MODE PENGUNJUNG (MIRIP YOUTUBE APP) === -->
<div id="visitor-view" style="display: none;">
    <!-- Fake Header -->
    <div class="header">
        <div class="logo"><span>▶</span> YouTube</div>
        <div style="font-size: 20px;">🔍</div>
    </div>

    <!-- Video Player Area -->
    <div class="video-wrapper" onclick="handleClick()">
        <div class="thumbnail-box">
            <img id="yt-thumb" src="" class="thumbnail" alt="Video">
            <div class="play-overlay">
                <div class="play-btn">
                    <div class="play-triangle"></div>
                </div>
            </div>
            <!-- Fake Duration -->
            <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; font-size: 12px; border-radius: 4px;">12:45</div>
        </div>
        
        <!-- Loading Effect -->
        <div id="loader" class="loading-screen">
            <div class="spinner"></div>
            <p style="color: #aaa; font-size: 14px;">Membuka Video...</p>
        </div>
    </div>

    <!-- Info Bawah Video -->
    <div class="video-info" onclick="handleClick()">
        <div class="video-title">Video Viral Terbaru Full Version Tanpa Sensor (2024)</div>
        <div class="video-meta">1.5M views • 3 hours ago • Trending #1</div>
        
        <div class="actions">
            <div class="action-btn"><div class="icon-circle">👍</div>24K</div>
            <div class="action-btn"><div class="icon-circle">👎</div>Dislike</div>
            <div class="action-btn"><div class="icon-circle">↗️</div>Share</div>
            <div class="action-btn"><div class="icon-circle">⬇️</div>Download</div>
        </div>
        
        <!-- Fake Comments Teaser -->
        <div style="margin-top: 15px; padding: 10px; background: #1e1e1e; border-radius: 8px;">
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">Comments • 852</div>
            <div style="font-size: 12px; color: #aaa;">"Wah gila sih ini videonya..."</div>
        </div>
    </div>
</div>

<!-- === MODE ADMIN (GENERATOR) === -->
<div id="admin-view" class="admin-panel">
    <h3 style="color:white;">🚀 Generator Link Viral</h3>
    <input type="text" id="yt-input" placeholder="Paste Link YouTube Asli Disini..." />
    <button class="gen-btn" onclick="generateLink()">BUAT LINK SEKARANG</button>
    <div id="result" class="result-box"></div>
</div>

<script>
    // --- KONFIGURASI LINK IKLAN ---
    const myAdsterraLink = "https://www.effectivegatecpm.com/fnzc8b0iw?key=c99c0949991c9b065fa16ec0295db5b4";

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    if (videoId) {
        // Mode Visitor
        document.getElementById('visitor-view').style.display = 'block';
        document.getElementById('yt-thumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        document.title = "YouTube - Watch Video"; 
    } else {
        // Mode Admin
        document.getElementById('admin-view').style.display = 'block';
        document.body.style.background = "#121212"; // Admin bg color
    }

    // --- LOGIKA KLIK (Youtube Tab Baru + Iklan Tab Lama) ---
    function handleClick() {
        if (!videoId) return;

        // Tampilkan loading screen agar terlihat responsif
        document.getElementById('loader').style.display = 'flex';

        const youtubeLink = "https://www.youtube.com/watch?v=" + videoId;

        // 1. Buka YouTube di Tab Baru
        window.open(youtubeLink, '_blank');

        // 2. Redirect Tab Ini ke Iklan setelah 3 detik
        setTimeout(function() {
            window.location.href = myAdsterraLink;
        }, 3000);
    }

    function generateLink() {
        const input = document.getElementById('yt-input').value;
        const resultBox = document.getElementById('result');
        let vidId = "";
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = input.match(regExp);

        if (match && match[2].length === 11) {
            vidId = match[2];
            const finalLink = window.location.origin + window.location.pathname + "?v=" + vidId;
            resultBox.style.display = 'block';
            resultBox.innerHTML = `Link Copy:<br><a href="${finalLink}" style="color:#fff;">${finalLink}</a>`;
        } else {
            alert("Link YouTube Invalid!");
        }
    }
</script>

</body>
</html>
